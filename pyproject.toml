[project]
name = "ha_blueair"
requires-python = ">=3.14"
dynamic = ["version"]

[build-system]
requires = ["setuptools>=62.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.ha_blueair" = ["*.json", "translations/*.json"]

[tool.setuptools.dynamic]
version = { attr = "custom_components.ha_blueair.const.VERSION" }

[dependency-groups]
ha = [
    "blueair-api==1.56.4",
    "homeassistant==2026.11.0",
]
lint = [
    { include-group = "ha" },
    "mypy",
    "prek",
    "ruff",
]
pytest = [
    { include-group = "ha" },
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant",
    "pytest-timeout",
]
dev = [
    { include-group = "lint" },
    { include-group = "pytest" },
]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/ha_blueair"]
explicit_package_bases = true
namespace_packages = true
pretty = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["blueair_api.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
indent-width = 4
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Rule set carried over from the previous .ruff.toml (based on Home Assistant core).
select = [
    "B007",    # Loop control variable {name} not used within loop body
    "B014",    # Exception handler with duplicate exception
    "C",       # complexity
    "E",       # pycodestyle
    "F",       # pyflakes/autoflake
    "I",       # isort
    "ICN001",  # import conventions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "SIM105",  # Use contextlib.suppress({exception}) instead of try-except-pass
    "SIM117",  # Merge with-statements that use the same scope
    "SIM118",  # Use {key} in {dict} instead of {key} in {dict}.keys()
    "SIM201",  # Use {left} != {right} instead of not {left} == {right}
    "SIM212",  # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
    "SIM300",  # Yoda conditions. Use 'age == 42' instead of '42 == age'.
    "SIM401",  # Use get from dict with default instead of an if block
    "T20",     # flake8-print
    "TRY004",  # Prefer TypeError exception for invalid type
    "RUF006",  # Store a reference to the return value of asyncio.create_task
    "UP",      # pyupgrade
    "W",       # pycodestyle
]
ignore = [
    "E501",    # line too long
    "E731",    # do not assign a lambda expression, use a def
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-third-party = ["blueair_api", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
ignore-words-list = "hass,ba,fo,abl"
skip = "custom_components/ha_blueair/translations/*"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
pythonpath = ["."]
addopts = """
  -p no:respx
  --quiet
  --timeout=20
  --durations=10
  -o console_output_style=progress
  --cov=custom_components/ha_blueair
  --cov-report=term-missing
  --cov-report=html
"""
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["custom_components/ha_blueair"]
relative_files = true
parallel = false

[tool.coverage.report]
show_missing = true
