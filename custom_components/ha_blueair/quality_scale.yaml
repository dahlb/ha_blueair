# Home Assistant Integration Quality Scale self-assessment.
# Rules: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
# hassfest only validates this file for core integrations; tests/test_quality_scale.py
# checks its format here.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: done
    comment: >-
      AWS devices get MQTT push updates; every device also polls at the configurable scan
      interval (default 5 minutes, 1-30).
  brands: done
  common-modules: done
  config-flow:
    status: done
    comment: >-
      ConfigFlow(domain=...) with data_description for every field, and login failures
      mapped to auth / cannot_connect / unknown form errors.
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: Config entries are keyed by the account username.

  # Silver
  action-exceptions:
    status: done
    comment: >-
      Device commands go through the coordinator's _async_device_command, which raises a
      translated HomeAssistantError (and starts reauth on a rejected login).
  config-entry-unloading:
    status: done
    comment: Unload disconnects MQTT and unloads every platform.
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Failed polls raise UpdateFailed, so DataUpdateCoordinator logs the outage once and
      its recovery once.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      Coverage (statements and branches) is above 95% for every module, and
      [tool.coverage.report] fail_under = 95 keeps it there.

  # Gold
  devices: done
  diagnostics:
    status: done
    comment: >-
      Credentials, the account email, and each device's MAC address and serial number are
      redacted, wherever they appear.
  discovery:
    status: exempt
    comment: Cloud account integration; devices are found through the Blueair account.
  discovery-update-info:
    status: exempt
    comment: Cloud account integration; devices are found through the Blueair account.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      The account's device list is checked every 30 minutes; a change reloads the entry,
      which sets up the new devices' entities.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment: >-
      Every entity has a translation key; unique IDs still use the original English
      names so existing entities keep their IDs.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: >-
      Changes the region and password; the username is the entry's unique ID, so another
      account gets its own entry.
  repair-issues:
    status: done
    comment: >-
      Raises a repair issue for life sensors that no longer use the battery device class.
  stale-devices:
    status: done
    comment: >-
      Setup removes devices the account no longer reports (skipped when the legacy API
      was unreachable or the account reports no devices), and
      async_remove_config_entry_device lets users delete a gone device.

  # Platinum
  async-dependency:
    status: todo
    comment: >-
      blueair_api's HTTP client is async, but its MQTT client wraps paho, which runs its own
      network thread and needs connect/disconnect in the executor.
  inject-websession:
    status: todo
    comment: >-
      Setup passes Home Assistant's shared session to blueair_api, but the config flow's
      credential check lets blueair_api open (and then close) its own session.
  strict-typing:
    status: todo
    comment: mypy reports about 190 errors without strict mode.
